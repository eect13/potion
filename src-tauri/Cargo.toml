[package]
name = "potion"
version = "1.4.0"
description = "Potion"
edition = "2021"
rust-version = "1.77"

[lib]
name = "potion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }

# Desktop only — Android must not pull this crate.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# Production builds must enable custom-protocol. Without it, tauri-macros sets
# `dev: true` and the WebView loads build.devUrl (http://127.0.0.1:8080) instead
# of bundled frontendDist / Android assets — black screen on release APKs.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
